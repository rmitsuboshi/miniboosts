[package]
name = "miniboosts-python"
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false
description = "Python bindings for MiniBoosts boosting algorithms"
repository = "https://github.com/rmitsuboshi/miniboosts"

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
miniboosts = { path = "..", version = "0.5.0" }
pyo3 = { version = "0.27.2", features = ["abi3-py310"] }

[features]
extension-module = ["pyo3/extension-module"]

[package]
name = "miniboosts-web"
version = "0.5.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false
description = "WebAssembly bindings for the interactive MiniBoosts demo"
repository = "https://github.com/rmitsuboshi/miniboosts"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
miniboosts = { path = "..", version = "0.5.1" }
# Must match the installed `wasm-bindgen` CLI version exactly.
wasm-bindgen = "=0.2.130"
console_error_panic_hook = "0.1.7"

[profile.release]
lto = true
opt-level = "s"

[workspace]
resolver = "3"
members = ["img/example"]

[workspace.package]
version = "0.5.0"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/rmitsuboshi/miniboosts"

[package]
name = "miniboosts"
version.workspace = true
edition = "2024"
rust-version.workspace = true
description = "A collection of boosting algorithms for research and comparison."
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["boosting", "machine-learning"]
categories = ["science"]
include = ["/src/**", "/tests/**", "/docs/logging.md", "/README.md", "/MIGRATION.md", "/RELEASING.md", "/LICENSE", "/Cargo.lock"]

[dependencies]
serde = { version = "1.0.229", features = ["rc", "derive", "alloc"] }
rayon = "1.12.0"
fixedbitset = "0.5.7"
colored = "3.1.1"
clarabel = "0.11.1"
